# dsh-rate-shield — 429 backoff, daily token budgets, tool-storm control
#
# Install:   dsh plugin --profile web add dsh-rate-shield
# Verify:    dsh --profile web --dump-config | grep -A3 'id: dsh-rate'
#
# Ships DISABLED (off by default). mode: 'monitor' meters/warns/audits only;
# mode: 'enforce' additionally DENIES tool calls inside a 429 backoff window,
# after daily-budget exhaustion (criticalAction: block-tools), and on
# tool-call storms. LLM requests themselves have no short-circuit channel in
# the current dsh event surface — this shields the tool loop around them.
#
# NOTE: a profile-level patch targeting this id replaces the WHOLE row config
# (no deep merge) — restate every key you want to keep.
- insert:
  - id: dsh-rate
    name: dsh-rate-shield
    config:
      enabled: false
      mode: monitor                    # monitor | enforce
      backoff:
        enabled: true
        baseMs: 30000                  # first 429 -> 30s quiet window
        factor: 2                      # 30s, 60s, 120s, ... capped:
        maxMs: 600000                  # 10 min
      budget:
        dailyTokens: 0                 # 0 = off; e.g. 2000000
        warnAt: 0.8                    # warn at 80%
        criticalAction: log            # log | block-tools (enforce mode)
      toolStorm:
        windowMs: 60000
        maxCalls: 0                    # 0 = off; e.g. 120 calls/min
      audit:
        enabled: true
        # file: .dsh-rate-shield/audit.jsonl  (default: <cwd>/.dsh-rate-shield/audit.jsonl)
